<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ассистент поддержки «ТехноМаркет»</title>
<style>
  :root { color-scheme: light dark; --line: #d7dbe0; --muted: #6b7280; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line);
           display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 200px; }
  header .hint { color: var(--muted); font-size: 12px; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  #log { display: flex; flex-direction: column; gap: 14px; min-height: 40vh; }
  .msg { border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; max-width: 80%; }
  .bot { align-self: flex-start; border: 1px solid var(--line); max-width: 90%; }
  .bot.refused { border-style: dashed; }
  .grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .grid button { font-size: 12px; padding: 4px 8px; border: 1px solid var(--line);
                 background: transparent; border-radius: 999px; cursor: pointer; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  form input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  form button { padding: 10px 16px; border: 0; border-radius: 8px;
                background: var(--accent); color: #fff; cursor: pointer; }
  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line);
             font-size: 13px; color: var(--muted); }
  .sources ol { margin: 4px 0 0; padding-left: 20px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Ассистент поддержки</h1>
  <label class="hint">Токен доступа
    <input id="token" type="password" value="customer-token" autocomplete="off">
  </label>
  <span class="hint">роль: покупатель (внутренние регламенты недоступны)</span>
</header>
<main>
  <div id="log"></div>
  <div class="grid" id="hints"></div>
  <form id="form">
    <input id="question" placeholder="Например: сколько идёт доставка в Москву?" autocomplete="off" required>
    <button type="submit">Спросить</button>
  </form>
</main>
<script src="/static/app.js"></script>
</body>
</html>
