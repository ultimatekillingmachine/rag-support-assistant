[project]
name = "rag-support-assistant"
version = "0.1.0"
description = "Support RAG assistant: grounded customer-support answers over a product knowledge base, with citations and evaluation."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
